[project]
name = "heaicare-capture-sim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "open3d>=0.20.0",
    "opencv-python-headless>=5.0.0.93",
    "pydantic>=2.14.3",
    "scipy>=1.18.1",
]

[project.scripts]
heaicare-capture-sim = "heaicare_capture_sim:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
